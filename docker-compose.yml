version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: meeting_postgres
    environment:
      POSTGRES_DB: meetingdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meeting_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/meetingdb
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SECRET_KEY: ${SECRET_KEY:-supersecretkey1234567890}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/output:/app/output

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meeting_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
